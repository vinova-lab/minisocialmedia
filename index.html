<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Mini Social Feed</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Mini Social Media Feed</h1>
<div class="post-form">
  <form action="/post" method="post">
    <input type="text" name="author" placeholder="Your name" required>
    <input type="text" name="content" placeholder="What's on your mind?" required>
    <button type="submit">Post</button>
  </form>
</div>
<hr/>
<div class="posts">
  <div th:each="p : ${posts}">
    <div class="post">
      <img th:src="${p.author != null ? '/static/default-avatar.png' : '/static/default-avatar.png'}" class="avatar"/>
      <div class="meta">
        <b th:text="${p.author}">Author</b>
        <span th:text="${p.createdAt}"></span>
      </div>
      <p th:text="${p.content}">Content</p>
      <div class="actions">
        <form th:action="@{'/like/' + ${p.id}}" method="post" style="display:inline">
          <button type="submit">Like (<span th:text="${p.likes}">0</span>)</button>
        </form>
      </div>
      <div class="comments">
        <div th:each="c : ${p.comments}">
          <small><b th:text="${c.author}"></b>: <span th:text="${c.text}"></span></small>
        </div>
        <form th:action="@{'/comment/' + ${p.id}}" method="post">
          <input type="text" name="author" placeholder="Your name" required>
          <input type="text" name="text" placeholder="Write a comment" required>
          <button type="submit">Comment</button>
        </form>
      </div>
    </div>
    <hr/>
  </div>
</div>
</body>
</html>
